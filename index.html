<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Resizer 🪄</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <h1>Image Resizer 🪄</h1>
      <p class="subtitle">Resize, style & download your image instantly</p>

      <div class="upload-section">
        <label for="fileInput" class="upload-label">📸 Upload Image</label>
        <input type="file" id="fileInput" accept="image/*" />
      </div>

      <div class="preview-section">
        <img id="preview" src="" alt="Preview" />
      </div>

      <div class="controls">
        <div class="control">
          <label>Width (px)</label>
          <input type="number" id="widthInput" placeholder="e.g. 500" />
        </div>
        <div class="control">
          <label>Height (px)</label>
          <input type="number" id="heightInput" placeholder="e.g. 400" />
        </div>
      </div>

      <div class="actions">
        <button id="applyBtn">Apply Changes</button>
        <br>
        <br>
        <a id="downloadLink" class="download-btn" style="display:none;" download="resized-image.png">
          ⬇️ Download Image
        </a>
      </div>

      <footer class="footer">💡 Created by <b>Aryan Sharma</b></footer>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
